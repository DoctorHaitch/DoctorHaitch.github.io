title: "Kris Hollingsworth, PhD"
description: "Accessibility doesn't need to look boring."

url: "http://192.168.1.159:4000"
baseurl: ""

github:
  is_project_page: false

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

paginate: 5          # posts per page (change as you like)
paginate_path: "/blog/page:num/"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      mathjax: true
      layout: main
      profile: false

  - scope:
      path: ""
      type: "posts"
    values:
      mathjax: true
      layout: main
      profile: false