- name: > 
    Investigate NSF Grant with colleagues from the University of Nebraska-Omaha.
  status: "Project Canceled, Necessary Course Software Denied by University IT department."
  academic_year: "2025-2026"
  description: >
    Project intended to support further research and development of a
    course where math, art, and computational thinking intersect. This work was initially the basis
    of my Math170 course, a new prep this semester, which could have led to a grant proposal for
    further research and development. The faculty at UNO were interested in collaborating on this project,
    as they had already had one grant funded in this area, and wanted to expand the scope outside their university
    in their next application.
  goal_two:
    - |
      I was unable to pursue this project due to the University IT department denying the necessary software
      for the course, which was a critical component of the project. This decision was made despite
      my repeated attempts to communicate the importance of the software for the course and the potential impact
      on student learning and engagement. I have communicated with my colleagues at UNO and they have expressed their
      understanding but disappointment with the situation.

      While waiting on approval from IT, I met with the UNO faculty members several times, and continued to
      discuss the project and potential grant proposal via email. Everything looked promising until the IT
      department denied the software, which was a critical component of the project. This decision effectively
      halted the project and prevented us from moving forward.

      Unfortunately, there is no way forward if IT will not allow the necessary software to be used. I would
      request the Dean review this situation, as I have heard similar impediments to research and scholarly
      collaborations from other faculty in the college, and it is a concern for the overall research and
      scholarly output of the institution--something he has stated as a clear priority. Perhaps he can
      assist in resolving the situation or provide guidance on how to proceed in the future.
      I am open to suggestions and would appreciate any support or advice on how to navigate this issue.
