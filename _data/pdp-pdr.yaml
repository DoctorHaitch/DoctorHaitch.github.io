- name: Began Research Collaboration with Dr. Marino Romero
  status: "Significant Progress, Ongoing"
  academic_year: "2025-2026"
  description:
    Began research collaboration with Dr. Marino Romero on a problem of mutual interest involving Wreath-Macdonald polynomials.
  goal_two:
    - |
      Dr. Marino and I met regularly throughout the Spring semester to design and implement code for computing specific
      inner products, building on some of Dr. Romero's previous work in this area, with the goal of developing computational
      tools to efficiently test hypotheses. A functional implementation will enable rapid exploration of conjectures and
      counterexamples, with potential connections to problems of interest in the physics community.

      We have made meaningful progress in structuring the computational approach, while identifying a primary challenge in
      constructing and manipulating certain polynomials over fractional field elements within Sage. Addressing these issues
      requires both careful mathematical formulation and thoughtful software design. After actively exploring multiple
      strategies to resolve these challenges, we have identified a strategy to move toward a robust and extensible implementation.

      Initial results are good, with several of the most significant challenges addressed. We are aiming to continue this work
      in the 2026-2027 academic year, with the goal of producing a functional implementation that can be used to explore conjectures
      planned for the near future of the new year.
  goal_three:
    - |
      Wreath-Macdonald polynomials are a new area of research to me, so Marino has regularly been teaching me about his field of research,
      and I have been reading through several of his papers and other resources. A significant amount of time has been spent understanding the
      theoretical background necessary to understand the notation and develop a computational model for this field.

      I provide evidence in the form of some email correspondence with Dr. Marino Romero, and a set of summary notes we have written
      documenting the project.
  evidence:
    - name: Email Correspondence with Dr. Marino Romero
      url: 'https://mnscu-my.sharepoint.com/:b:/g/personal/ye6366mb_minnstate_edu/IQD7KyL1kr78Tq8FRpLnxG3AAcOkhAyUKq6OOAo2uXF1fCM?e=HkPsQL'
