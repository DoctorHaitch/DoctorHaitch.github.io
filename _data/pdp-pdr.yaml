# ######################
# #\begin{activity}{Cohost FriDEI weekly Discussions during Fall semester.}
# #\goal[3]{Preparation and facilitation of these discussions contributed significantly to my professional development by deepening my understanding of equity-focused pedagogy in mathematics. Reviewing planning materials, recurring themes included identity in mathematics (e.g., “who is a math person”), navigating power dynamics between instructors and students, and strategies for initiating difficult conversations. A particularly valuable aspect was engaging graduate students in their dual roles as both learners and instructors, which provided candid insight into current classroom challenges. A consistent thread across discussions was the tension between maintaining assessment rigor and implementing policies that promote meaningful learning opportunities and student growth.}
# #\goal[4]{These discussions benefited students through an equity-focused lens by fostering more inclusive teaching practices that recognize diverse student experiences and barriers to success. Conversations emphasized creating supportive classroom environments, incorporating flexibility and grace in assessment practices, and amplifying student voices, particularly those from underrepresented groups. Feedback from participating graduate students and faculty suggests these meetings encouraged reflection on teaching practices and contributed to more equitable and student-centered approaches in mathematics instruction alongside greater awareness of both visible and invisible challenges currently facing our students.}
# #\goal[5]{Co-hosted bi-weekly discussions centered on equitable teaching practices in mathematics courses with Dr. Marino Romero. This seminar brought together graduate students and faculty to address a gap in discipline-specific conversations around equity and inclusion in STEM, where adapting broader pedagogical strategies can be more challenging. Topics included professional identity, allyship, power dynamics, and grading practices, grounded in real classroom experiences. The series created a collaborative space for sharing strategies and reflecting on teaching. We plan to continue and expand this round-table discussion series in the coming academic year.}
