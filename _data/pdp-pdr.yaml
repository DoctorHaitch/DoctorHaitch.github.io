- name: Digital Document Accessibility Efforts
  status: Significant Progress, Ongoing
  description:
    Progress towards April 20, 2027 ADA compliance deadline for all digital documents. 
  goal_one: 
    - |
      I have made significant progress towards the April 20, 2027 ADA compliance deadline for all digital documents. This includes
      reviewing and updating course materials, lecture notes, and other digital resources to ensure they meet accessibility standards.
      Samples of updated course materials including interactive, ADA compliant lecture notes are provided in the evidence section.
  goal_two:
    - |
      I have been working to develop my own course document creation pipeline for generating ADA compliant course notes. This is
      OER Software work, which began by writing a custom plug-in to allow embedding DoenetML Interactive Course Activities into
      rapidly authored Markdown documents. This plugin is open source, and the github repo for the project is provided in the evidence section.
      Additionally, I have been working on blogging and documenting the process, philosophy, and considerations authors should
      take into account when considering authoring long-term, maintainable, digital documents with accessibility in mind. Links
      to some of these blog posts are also in the evidence.

      Additionally, I am in the process of creating a full course-note authoring software package that will allow authors to rapidly create
      ADA compliant course notes with interactive content, and will be open source. Currently this is a missing piece in much of the
      OER software ecosystem, which is generally focused on creating full-length books or practice problem sets for automated grading,
      and not on creating course notes that are accessible, interactive, and maintainable over time.

      This also allows opportunities for internal and external publishing regarding creating accessible materials as many people
      are working on this problem. Internally, I have contacted the library to pursue providing resources to faculty publishing
      on Cornerstone. Externally, I have been invited to contribute to the math-tech.org blog, and I will be also considering
      submitting to various MAA Blogs or Journals if such activities would be clearly supported by the Dean's office.
    - |
      As part of this work, I also attended as an invited speaker to discuss this work at the Doenet Community Workshop (2026)
      at the  Institute for Mathematics and Its Applications (IMA) at the University of Minnesota.
      I was invited to speak about my work in creating accessible course materials that incorporated DoenetML activities as part 
      of the session "Doenet In Other Places". There was no publically available materials for this, but for evidence
      I have included my workshop participation information and my summary of the final day workshop Show-and-Tell session where
      I also document some of the other important collaborations that arose during the workshop. If needed for evidence, I can obtain
      confirmation of this presentation from the organizers.
  goal_three: |
    To support efforts in digital document accessibility, I have been actively learning how to contribute to OER Github Projects,
    such as DoenetML and prefigure. I provide a link which documents some of my contributions in providing extensive issue reports
    and some pull requests to such projects. For these efforts, I have recently had to learn

    * Markdown
    * Typescript
    * Node.js
    * Cypress Automated Testing
    * Github Project Management and Issue Tracking
    * WCAG Accessibility Standards and Testing
    * Jekyll and Jinja2 Templating Engines
    * Abstract Syntax Trees and Semantic Analysis of Documents
    * Concepts of Literate Programming and Document Authoring Pipelines

  goal_five: |
    I am making strong efforts to make my work in this area accessible to colleagues and other faculty members. Currently,
    I have a GitHub Repository for tools creating Accessible Math Materials. This includes templates for creating PDF/UA compliant
    documents using LaTeX which can incorporate technical mathematics and diagrams. Additionally, I have creating several authoring 
    layers for course notes, including preprocessing templates, static materials, and custom Pandoc writers to generate
    accessible HTML materials that can be posted directly to D2L or other course management systems.

    Additionally, I am currently maintaining a inventory of the current OER tools available to content authors for creating
    accessible mathematics and scientific content for students. That resource is also listed in the evidence. I have been invited
    to contribute to the math-tech.org blog as part of this project, and will do so during the next academic year.
  alignment_note: |
    This activity strongly advances Equity 2030 goals by expanding equitable access to learning
    materials and supporting student success for diverse learners. Creation of accessible course
    materials, open educational resources, and accessibility-focused tools helps reduce barriers to
    participation and achievement. The work aligns with Destination 2030 commitments to equitable
    education, innovation in instructional delivery, and eliminating educational equity gaps.
