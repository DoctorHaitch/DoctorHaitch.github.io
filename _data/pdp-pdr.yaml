- name: >
    Continue drafting of book in support of Math 605, Graphs and Algorithms, titled
    Topics in Algebraic Combinatorics and Optimization.
  status: "Significant Progress, Ongoing"
  academic_year: "2025-2026"
  description: >
    I am continuing to draft a book in support of Math 605, Graphs and Algorithms in collaboration
    with my co-author, Dr. Sebastian Cioabă. The book is titled "Topics in Algebraic Combinatorics and Optimization"
    and aims to provide a comprehensive introduction to the field of algebraic combinatorics, with a focus on its
    applications to optimization problems. The book will cover fundamental concepts, techniques, and algorithms
    in algebraic combinatorics, as well as their connections to optimization theory and practice.
    It will also include numerous examples, detailed proofs, and exercises to illustrate the practical applications
    of the material covered.
  goal_two:
    - >
      I have made significant progress in drafting the book, including writing several chapters and sections,
      developing examples and exercises, and incorporating feedback and material from my co-author.
      Unfortunately there is little support from the Dean's office at this time for this type of scholarly work,
      so it has been difficult to prioritize this work over other responsibilities. As a result, I will likely be
      unable to continue this work until the course is offered again in the 2027-2028 academic year.
      I will continue to make progress on the book as time allow, but a focus on this resulted in the Dean reporting
      that I was not making sufficient progress on my Criterion 2 goals, which is a concern for me as I feel that this
      work is a significant scholarly contribution to the field of mathematics and will have a positive impact on
      student learning and engagement in Math 605.

