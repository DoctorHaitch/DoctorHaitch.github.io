- name: "Cohost FriDEI weekly Discussions during Fall semester."
  status: "Completed"
  academic_year: "2025-2026"
  description: >
    Co-hosted bi-weekly discussions on equitable teaching practices in mathematics courses with Dr. Marino Romero.
  goal_three:
    - >
      Preparation and facilitation of these discussions contributed significantly to my professional development by deepening
      my understanding of equity-focused pedagogy in mathematics. Reviewing planning materials, recurring themes included
      identity in mathematics (e.g., “who is a math person”), navigating power dynamics between instructors and students,
      and strategies for initiating difficult conversations. A particularly valuable aspect was engaging graduate students
      in their dual roles as both learners and instructors, which provided candid insight into current classroom challenges.
      A consistent thread across discussions was the tension between maintaining assessment rigor and implementing policies
      that promote meaningful learning opportunities and student growth.
  goal_four:
    - >
      These discussions benefited students through an equity-focused lens by fostering more inclusive teaching practices that
      recognize diverse student experiences and barriers to success. Conversations emphasized creating supportive classroom
      environments, incorporating flexibility and grace in assessment practices, and amplifying student voices, particularly
      those from underrepresented groups. Feedback from participating graduate students and faculty suggests these meetings
      encouraged reflection on teaching practices and contributed to more equitable and student-centered approaches in mathematics
      instruction alongside greater awareness of both visible and invisible challenges currently facing our students.
  goal_five:
    - >
      Co-hosted bi-weekly discussions centered on equitable teaching practices in mathematics courses with Dr. Marino Romero.
      This seminar brought together graduate students and faculty to address a gap in discipline-specific conversations around
      equity and inclusion in STEM, where adapting broader pedagogical strategies can be more challenging. Topics included
      professional identity, allyship, power dynamics, and grading practices, grounded in real classroom experiences.
      The series created a collaborative space for sharing strategies and reflecting on teaching. We would like to find a way to
      continue this work in the future.

      The evidence includes shared meeting planning notes and a sample email to faculty and graduate students.
       These provide a log of topics discussed, including identity in mathematics, grace in teaching, power dynamics,
       advocacy, and grading practices, as well as dates of meetings and brainstorming for future prompts.
  alignment_note: |
    This activity has direct and explicit alignment with Equity 2030 goals concerning equitable
    outcomes, culturally responsive teaching, and workforce diversity. It also strongly supports
    Destination 2030's commitment to diversity, inclusion, belonging, supportive campus climate,
    and elimination of educational equity gaps.
