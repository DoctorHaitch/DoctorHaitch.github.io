- name: "Teach six, 4-credit hour courses."
  academic_year: "2025-2026"
  status: "Completed"
  description: |
    * Math122: Calculus II (2 Sections Each Term)
    * Math605: Graphs and Algorithms (1 Section, Fall)
    * Math170: Intro to Mathematical Software Programming (1 Section, Spring)
  goal_one: 
    - | 
      In Math 122, I feel that the Fall semester was much more successful than the Spring semester.
      Unfortunately, several assessments that have traditionally been successful in promoting student
      learning were much less effective with the increased usage of AI tools. In particular, allowing students
      to revise and resubmit their work was much less effective than in previous semesters, as students were able
      to use AI tools to generate solutions that they could then submit without fully understanding the material.
      I am currently exploring alternative assessment strategies that will be more effective in promoting student
      learning in this new environment.

      Additionally, please see the attached letter of observation by Dr. Charles Krois, which provides a detailed assessment
      of one class session during the Fall semester and subsequent discussion.
    - > 
      In Math 170, I developed all course materials from scratch, including lectures, assignments, and assessments.
      This course introduced students to programming concepts and techniques using MatLAB, as the only commercial
      computer algebra system that the university currently licenses. We focused on using computational aids to solve
      mathematical problems and looked at their mathematical bases. We covered all the core programming concepts,
      including variables, functions, conditional logic, loops, recursion and its relationship to induction, debugging strategies,
      and some classical problems such as the Collatz conjecture and the Josephus problem. We discussed trade-offs in various
      programming approaches and the importance of writing clear, maintainable code.
    - >
      In Math 605, I revised the course to include more introductory material and to focus on developing students' understanding
      of the fundamental concepts in graph theory and algorithms before moving to the main topics, as we have no graph-theoretic
      background requirements for the course. This included developing new lectures, assignments, and assessments that focused on
      the basics of graph theory, including definitions, properties, and basic algorithms. This appeared to significantly
      improve the understanding and outcomes for students in the course, and will be a focus of future iterations of the course.
  goal_three:
    - | 
      I continue to invite at least one external faculty member to observe my classes and provide feedback to improve my
      teaching effectiveness and strategies. This year, Dr. Charles Krois observed one of my Math 122 classes and provided
      detailed feedback on my teaching methods.

      I have incorporated several of his suggestions for this upcoming year. In particular, I've incorporated a more structured
      approach to announcements and reminders as part of the new lecture notes that will also be provided to students in D2L
      as part of the Digital Document Accessibility Compliance efforts noted elsewhere in this report. I have also added
      a universal first self-assessment report to address the issue noted in his letter. Further revisions to self-assessment
      and revision will be made in the 2026-2027 academic year as a result of the observations regarding AI usage and the
      effectiveness of the self-assessment and revision process noted in my self-evaluation.
  goal_four: 
    - >
      In Math 122, students were required to complete creative final projects. These challenged students to apply their knowledge
      in novel ways, fostering deeper understanding and engagement with the course material. This semester, students created
      scrapbooks of their learning, which included reflections on their understanding of key concepts, connections to real-world
      applications, and scraps of their course assessments. A group of students collaborated on a rap battle project, where they wrote
      and performed a rap that creatively explained mathematical concepts covered in the course. These students not only collaborated in 
      the class, but also brought in film students from Bethany college to assist with the filming and production.
    # - > Ooops. This was Functional Analysis, not 605.
    #   In Math 605, I implemented a flipped classroom model where students engaged with lecture materials and readings outside of class,
    #   beginning about 2/3rds of the way through the semester after students had the opportunity to develop a strong base from a more
    #   traditional course format given it was novel material and core topics for most students in the course. 
    #   Students then collaborated outside of class and presented sections of the lecture in class as their primary assessment.
    #   This approach aimed to enhance student engagement and understanding of complex concepts by providing opportunities for
    #   active learning and peer-to-peer instruction, as well as developing students skills in communication, collaboration,
    #   and critical thinking.
    - >
      In Math 605, I developed several final presentation projects. Students had the option to implement and present a computer
      program that demonstrated their understanding of the course material or take a final exam. The course split exactly
      50-50 between these two options. Both options were highly successful in promoting student learning and engagement, with
      students demonstrating a strong understanding of the course material and the ability to apply it in novel ways.
      The final presentations were particularly effective in allowing students to showcase their understanding of the
      course material and their ability to communicate complex ideas effectively, even for those who struggled with
      written presentations of their work.
    - >
      In both Math122 and Math605, students were required to keep a journal logging their learning and course engagement,
      with specific practice exercises also assigned to be maintained in this document. This journal was intended to encourage 
      students to reflect on their learning, identify areas of strength and weakness, as well as practice course material.
    - |
      In Math 170, students designed and executed their own final project, along with an accompanying report and presentation.
      This project required students to apply the programming concepts and techniques they had learned throughout the course
      to solve a mathematical problem of their choice. Students were encouraged to explore topics that interested them.
      This semester, students developed problems related to Fourier Analysis, Number Theory, Calculus, Computational Complexity,
      Biological Math Modeling, Matrix Theory, and others. Students were required to present their projects to the class,
      demonstrating their understanding of the programming concepts and techniques they had learned, as well as their ability
      to communicate their explorations effectively. These projects were scaffolded with numerous check-ings and feedback sessions
      throughout the last half of the semester to ensure students were on track and to provide guidance, mentorship, and support
      as needed.
      
      One student in particular went on to continue working on data analysis projects in MatLAB and reached out
      for additional mentorship and guidance on their project.

