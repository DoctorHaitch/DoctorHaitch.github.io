# ##############
# Schema Details
# ##############
# Categories: Authoring, Format Conversion, Activity Creation, Hosting/Deployment, Student Data Collection
# Within each category, the following fields are used:
# title: The name of the tool or software.
# status: The current development or release status of the tool (e.g., Stable, In Development, Beta).
# subtitle: A brief description or tagline for the tool.
# description: A more detailed explanation of the tool's purpose, features, and use cases.
#       Is markdownified.
# subblocks: A list of subcategories or specific aspects of the tool, each containing:
#   block_title: The title of the subcategory or aspect.
#   details: A list of specific details, features, or components related to the subcategory
#       is NOT markdownified, use html tags.
# ##############

last_updated: 2026-07-07

authoring:
  intro: Most content authoring should start here by selecting a language platform for creating structured content. Optimal tools will focus on authoring well-structured, semantically meaningful content that can be read as abstract syntax trees and then converted to multiple output formats. The separation between content authoring and content presentation is important for accessibility, maintainability, and long-term sustainability of content.
  blocks:
    - title: "Markdown" 
      status: "Stable"
      subtitle: "A lightweight, minimalist markup language for creating formatted text from a plain-text editor."  # (Was role)
      description: |
        Markdown is a lightweight markup language designed to make writing structured, readable documents in plain text both simple and portable.
        Originally created by John Gruber in 2004 (with contributions from Aaron Swartz), Markdown was motivated by the idea that writers should be able to focus on content rather than formatting syntax.
        It has since become a de facto standard for technical writing and documentation, with widespread use in platforms like GitHub, Jupyter notebooks, static site generators such as Jekyll, and academic workflows that rely on reproducible, version-controlled materials.

        For content authors, it offers a low-friction way to write clean, structured content with minimal syntax to learn.
        The resulting material can be converted into a wide range of formats, making it well-suited for lecture notes, course websites, and computational notebooks where clarity, rapid authoring, maintainability, and accessibility matter.

        In mathematical and accessibility-focused contexts, Markdown is especially useful because it can naturally integrate tools like LaTeX or include embedded HTML manipulatives.
        It serves as a bridge between informal drafting and structured, accessible presentation—making it a practical foundation for building inclusive digital mathematics content.
      subblocks:
        - block_title: "Tutorials and Resources"
          details:
            - '<a href="https://www.markdowntutorial.com" target="_blank">MarkdownTutorial.com</a> is an interactive tutorial that guides users through the basics of Markdown syntax, including headings, lists, links, and code blocks.'
        - block_title: "Authoring Software"
          details:
            - '<a href="https://obsidian.md" target="_blank">Obsidian</a>: A powerful knowledge management and note-taking application that uses Markdown as its primary format. It allows users to create interconnected notes, visualize relationships between ideas, and manage large collections of Markdown documents efficiently.'
            - '<a href="https://quarto.org" target="_blank">Quarto</a>: An open source technical publishing system for creating beautiful articles, websites, blogs, books, slides, and more. Supports Python, R, Julia, and JavaScript.'

    - title: "PreTeXt"
      status: "Stable"
      subtitle: "A markup language for authoring accessible mathematical content."
      description: |
        PreTeXt is a markup language designed to facilitate the creation of high-quality, accessible mathematical content. It allows authors to write structured documents that can be easily converted into multiple formats, including HTML, PDF, and ePub, while ensuring that the content remains accessible to all users, including those using assistive technologies.

        PreTeXt emphasizes semantic markup, which means that mathematical expressions and structures are represented in a way that conveys their meaning rather than just their appearance. This approach enhances accessibility and usability, making it easier for screen readers and other assistive tools to interpret the content correctly.

        The PreTeXt ecosystem includes tools for authoring, validating, and publishing documents. Authors can focus on the content itself without worrying about the complexities of formatting or accessibility compliance. The resulting documents are not only visually appealing but also adhere to best practices in accessibility and usability.

        Overall, PreTeXt provides a powerful framework for creating educational materials in mathematics and related fields, supporting both authors and learners in achieving a more inclusive learning experience.
      subblocks:
        - block_title: "Tutorials and Resources"
          details:
            - '<a href="https://pretextbook.org" target="_blank">PreTeXt Authoring Tools</a>: A suite of tools for creating and managing PreTeXt documents, including editors, validators, and converters.'
        - block_title: "Deployment Options"
          details:
            - '<a href="https://pretextbook.org/doc/guide/html/tutorial-install.html" target="_blank">Local PreTeXt Deployment (ptx)</a>: Installation and setup instructions for running PreTeXt on a local machine.'
            - '<a href="https://github.com/pretextbook/pretext-codespace" target="_blank">PreTeXt GitHub Codespace</a>: A cloud-based environment for authoring and compiling PreTeXt documents without the need for local installation.'
            - '<a href="https://pretext.plus/" target="_blank">PreTeXt Plus</a>: A service that supports the authoring and sharing of PreTeXt documents using only a web browser. Supports graded LMS content through SCORM integration.'
    - title: "PreFigure"
      status: "Stable"
      subtitle: "A markup language for authoring accessible mathematical content."
      description: |
        PreFigure is a markup language designed to facilitate the creation of high-quality, accessible mathematical diagrams.

        It describes itself as "PreFigure is to figures what PreTeXt is to text," emphasizing its focus on creating structured, semantically meaningful figures that can be easily integrated into educational or research materials. PreFigure allows authors to define mathematical diagrams in a way that is both human-readable and machine-interpretable, ensuring that the resulting figures are accessible to all users, including those using assistive technologies.
      subblocks:
        - block_title: "Tutorials and Resources"
          details:
            - '<a href="https://prefigure.org" target="_blank">PreFigure Authoring Tools</a>: A suite of tools for creating and managing PreFigure documents, including editors, validators, and converters.'
            - '<a href="https://github.com/davidaustinm/prefigure" target="_blank">PreFigure GitHub Repository</a>: The official repository for PreFigure, containing source code, documentation, and examples.'
    - title: "LaTeX"
      status: "Stable"
      subtitle: "A typesetting system used for creating high-quality documents, particularly in academia and scientific publishing."
      description: |
        The industry standard for mathematical typesetting for many years.
      subblocks:
        - block_title: "Tutorials and Resources"
          details:
            - '<a href="https://www.latex-project.org/help/documentation/" target="_blank">LaTeX Documentation</a>: Official documentation and guides for using LaTeX, including tutorials, reference manuals, and best practices.'
            - '<a href="https://www.overleaf.com/learn" target="_blank">Overleaf Learn</a>: A collection of tutorials and resources for learning LaTeX, including templates, examples, and tips for effective document preparation.'
            - '<a href="https://typst.app/" target="_blank">Typst</a>: A modern typesetting system that aims to provide a more user-friendly and intuitive experience compared to traditional LaTeX, while still supporting high-quality mathematical typesetting.'
    - title: "HTML5"
      status: "Stable"
      subtitle: "The basic building block of the web, HTML5 is a markup language used for structuring and presenting content on the World Wide Web."
      description: |
        HTML5 is a markup language used for structuring and presenting content on the World Wide Web.

        Many of the authoring options generate structured, accessible HTML5 content.

